<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Agent Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border-color: #333; }
        .btn-primary { background-color: #0d6efd; border-color: #0d6efd; }
        .btn-danger { background-color: #dc3545; border-color: #dc3545; }
        #monitor-img { width: 100%; border: 2px solid #333; }
        .status-badge { font-weight: bold; }
        .log-box { font-family: monospace; font-size: 0.9em; background: #000; color: #0f0; padding: 10px; height: 150px; overflow-y: scroll; }
    </style>
    <script>
        function refreshImage() {
            const img = document.getElementById('monitor-img');
            img.src = "/static/latest_monitor.png?t=" + new Date().getTime();
        }

        function refreshStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('status-text').innerText = data.status;
                    document.getElementById('objective-text').innerText = data.objective || "None";
                    document.getElementById('log-content').innerText = data.last_log;

                    const badge = document.getElementById('status-badge');
                    badge.className = 'badge status-badge ' + (data.status === 'WORKING' ? 'bg-success' : 'bg-secondary');
                    badge.innerText = data.status;
                });
        }

        setInterval(refreshImage, 2000);
        setInterval(refreshStatus, 3000);
    </script>
</head>
<body class="container py-4">
    <h1 class="mb-4">Sovereign Agent Control</h1>

    <div class="row">
        <!-- Live Monitor -->
        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-header">Live Feed</div>
                <div class="card-body p-0">
                    <img id="monitor-img" src="/static/latest_monitor.png" alt="Waiting for Agent...">
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="col-md-4">
            <div class="card mb-3">
                <div class="card-header">Status Panel</div>
                <div class="card-body">
                    <p>Status: <span id="status-badge" class="badge bg-secondary">IDLE</span></p>
                    <p>Objective: <strong id="objective-text">None</strong></p>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header">Controls</div>
                <div class="card-body">
                    <form action="/objective" method="post">
                        <div class="mb-3">
                            <label for="objective" class="form-label">New Objective</label>
                            <input type="text" class="form-control" id="objective" name="objective" required placeholder="e.g. Open Firefox">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Set Objective</button>
                    </form>
                    <hr>
                    <a href="/stop" class="btn btn-danger w-100">STOP AGENT</a>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Latest Log</div>
                <div class="card-body p-0">
                    <div id="log-content" class="log-box"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
