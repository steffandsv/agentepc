<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal {
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col">

    <header class="bg-gray-800 p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">Browser Agent Control</h1>
            <div id="status-indicator" class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-gray-500" id="status-dot"></span>
                <span id="status-text">Idle</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4 flex-grow flex gap-4 h-[calc(100vh-80px)]">

        <!-- Left Panel: Controls & Logs -->
        <div class="w-1/3 flex flex-col gap-4">

            <!-- Controls -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-md">
                <h2 class="text-lg font-semibold mb-2">Task Control</h2>
                <textarea id="task-input" class="w-full bg-gray-700 text-white p-2 rounded mb-2 border border-gray-600" rows="3" placeholder="Enter task here..."></textarea>
                <div class="flex gap-2">
                    <button id="start-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded flex-1">Start Task</button>
                    <button id="stop-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded flex-1" disabled>Stop</button>
                </div>
            </div>

            <!-- Logs -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-md flex-grow flex flex-col overflow-hidden">
                <h2 class="text-lg font-semibold mb-2">Execution Logs</h2>
                <div id="logs" class="terminal bg-black p-2 rounded flex-grow overflow-y-auto text-sm text-green-400 font-mono whitespace-pre-wrap">
                    <!-- Logs will appear here -->
                </div>
            </div>
        </div>

        <!-- Right Panel: Visualization -->
        <div class="w-2/3 flex flex-col gap-4">
            <!-- Screenshot/Stream -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-md flex-grow flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-lg font-semibold">Live View</h2>
                    <span id="current-url" class="text-xs text-gray-400 truncate max-w-md"></span>
                </div>
                <div class="bg-black flex-grow rounded flex items-center justify-center overflow-hidden border border-gray-700 relative">
                    <img id="browser-view" src="" alt="Browser Stream" class="max-w-full max-h-full object-contain hidden">
                    <div id="placeholder" class="text-gray-500">Waiting for agent...</div>
                </div>
            </div>

            <!-- Current Thought -->
            <div class="bg-gray-800 p-4 rounded-lg shadow-md h-1/4 overflow-y-auto">
                <h2 class="text-lg font-semibold mb-1 text-purple-400">Agent Thought</h2>
                <p id="thought-display" class="text-sm text-gray-300 italic">...</p>
            </div>
        </div>

    </main>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
        let socket = null;

        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const taskInput = document.getElementById('task-input');
        const logsDiv = document.getElementById('logs');
        const browserView = document.getElementById('browser-view');
        const placeholder = document.getElementById('placeholder');
        const thoughtDisplay = document.getElementById('thought-display');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const currentUrl = document.getElementById('current-url');

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                log("System", "Connected to server.");
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            socket.onclose = () => {
                log("System", "Disconnected. Reconnecting...");
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleMessage(data) {
            console.log("Msg:", data);
            if (data.type === 'log') {
                log("Agent", data.message);
            } else if (data.type === 'status') {
                updateStatus(data.status);
            } else if (data.type === 'step') {
                // Update screenshot
                if (data.screenshot) {
                    browserView.src = `data:image/png;base64,${data.screenshot}`;
                    browserView.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }

                // Update thought
                if (data.thought) {
                    thoughtDisplay.innerText = data.thought;
                }

                if (data.url) {
                    currentUrl.innerText = data.url;
                }

                log("Step", `Completed step ${data.step}`);
            } else if (data.type === 'error') {
                log("Error", data.message, true);
            }
        }

        function log(source, message, isError = false) {
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="text-gray-500">[${time}]</span> <span class="font-bold ${isError ? 'text-red-500' : 'text-blue-400'}">${source}:</span> ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function updateStatus(status) {
            statusText.innerText = status.charAt(0).toUpperCase() + status.slice(1);
            if (status === 'running' || status === 'initializing') {
                statusDot.classList.remove('bg-gray-500', 'bg-red-500', 'bg-green-500');
                statusDot.classList.add('bg-yellow-500', 'animate-pulse');
                startBtn.disabled = true;
                stopBtn.disabled = false;
                taskInput.disabled = true;
            } else if (status === 'completed') {
                statusDot.classList.remove('bg-yellow-500', 'animate-pulse');
                statusDot.classList.add('bg-green-500');
                startBtn.disabled = false;
                stopBtn.disabled = true;
                taskInput.disabled = false;
            } else if (status === 'stopped' || status === 'error') {
                statusDot.classList.remove('bg-yellow-500', 'bg-green-500', 'animate-pulse');
                statusDot.classList.add('bg-red-500');
                startBtn.disabled = false;
                stopBtn.disabled = true;
                taskInput.disabled = false;
            } else {
                statusDot.classList.remove('bg-yellow-500', 'bg-green-500', 'bg-red-500', 'animate-pulse');
                statusDot.classList.add('bg-gray-500');
            }
        }

        startBtn.addEventListener('click', async () => {
            const task = taskInput.value.trim();
            if (!task) return;

            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task })
                });
                const res = await response.json();
                if (res.status === 'error') {
                    log("Error", res.message, true);
                }
            } catch (e) {
                log("Error", "Failed to start task: " + e, true);
            }
        });

        stopBtn.addEventListener('click', async () => {
            try {
                await fetch('/api/stop', { method: 'POST' });
            } catch (e) {
                log("Error", "Failed to stop task: " + e, true);
            }
        });

        connectWebSocket();
    </script>
</body>
</html>
